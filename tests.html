<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LevelUp · Testes</title>
  <style>
    body { font: 15px/1.4 -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; background: #f2f2f7; color: #000; }
    h1 { font-size: 26px; margin: 8px 0 4px; }
    #summary { font-weight: 700; margin-bottom: 12px; }
    .ok { color: #1f8a3b; } .fail { color: #d70015; }
    li { background: #fff; list-style: none; margin: 0 0 6px; padding: 10px 12px; border-radius: 10px; }
    ul { padding: 0; }
    pre { white-space: pre-wrap; margin: 4px 0 0; font-size: 12px; }
    h2 { font-size: 13px; text-transform: uppercase; color: #6c6c70; margin: 20px 4px 8px; }
  </style>
</head>
<body>
  <h1>Testes da LevelUp</h1>
  <div id="summary">A correr…</div>
  <div id="out"></div>

  <script type="module">
    import { toKey, fromKey, addDays, weekday, weekStart, weekKey, monthKey, daysBetween, capsDate, greeting, shortDate, longDate } from './js/engine/dates.js';
    import { makeIndex, checkId, isScheduled, weekCount, todayList, streak, bestStreak, last7, rate, frequencyLabel, migrateV1, dayState, totalDone, todaySummary, bestActive, atRisk, avoidList, qtyOn, weekdayRates, weakestDay, monthRates, dayScore, isPaused } from './js/engine/habits.js';
    import { occursOn, eventsOn, duration, formatDuration, nowLineIndex, timeStates, toICS, toMin } from './js/engine/agenda.js';
    import { parseAmount, fmtEUR, summary, monthSummary, budgetPace, balanceBetween, spentOn, lastDayOfMonth } from './js/engine/money.js';
    import { periodRange, progress, shiftPeriod, currentPeriod, goalsFor, featuredWeekly, weekLabel } from './js/engine/goals.js';
    import { todosOn, overdue, inbox, nextDate, prioritiesOn, stepsLabel } from './js/engine/todos.js';
    import { parseQuick } from './js/engine/parse.js';
    import { nextOccurrence, countdowns } from './js/engine/agenda.js';
    import { nudges } from './js/engine/nudges.js';
    import { series, objProgress, pace, milestones, suggestMilestones, direction, sortObjectives } from './js/engine/objectives.js';
    import { history } from './js/engine/goals.js';
    import { trigger, journalPrompt, closingLine, hash, TRIGGERS, JOURNAL_PROMPTS } from './js/engine/phrases.js';

    const groups = [];
    let current;
    const group = (name) => groups.push((current = { name, tests: [] }));
    const test = (name, fn) => current.tests.push({ name, fn });
    const eq = (a, b, msg = '') => {
      const A = JSON.stringify(a), B = JSON.stringify(b);
      if (A !== B) throw new Error(`${msg}esperado ${B}, obtido ${A}`);
    };
    const ok = (v, msg = 'esperado verdadeiro') => { if (!v) throw new Error(msg); };

    // Ajudas
    const H = (id, rec = { tipo: 'diario' }, extra = {}) => ({ id, nome: id, recorrencia: rec, criadaEm: '2026-10-01', ...extra });
    const idxOf = (pairs) => makeIndex(pairs.map(([habitId, data]) => ({ habitId, data })));
    const days = (id, from, n) => Array.from({ length: n }, (_, i) => [id, addDays(from, i)]);
    const THU = '2026-11-05'; // quinta-feira

    // ---------- Datas ----------
    group('Datas');
    test('toKey / fromKey ida e volta', () => eq(toKey(fromKey('2026-02-28')), '2026-02-28'));
    test('addDays muda de mês e de ano', () => { eq(addDays('2026-01-31', 1), '2026-02-01'); eq(addDays('2026-12-31', 1), '2027-01-01'); eq(addDays('2026-03-01', -1), '2026-02-28'); });
    test('addDays atravessa a mudança de hora', () => { eq(addDays('2026-03-28', 2), '2026-03-30'); eq(addDays('2026-10-24', 2), '2026-10-26'); });
    test('Dia da semana: 1 = segunda, 7 = domingo', () => { eq(weekday('2026-11-02'), 1); eq(weekday(THU), 4); eq(weekday('2026-11-08'), 7); });
    test('A semana começa à segunda', () => { eq(weekStart('2026-11-08'), '2026-11-02'); eq(weekStart('2026-11-02'), '2026-11-02'); });
    test('Semana ISO', () => { eq(weekKey(THU), '2026-W45'); eq(weekKey('2026-01-01'), '2026-W01'); eq(weekKey('2024-12-30'), '2025-W01'); });
    test('Mês, diferença de dias e etiqueta', () => { eq(monthKey(THU), '2026-11'); eq(daysBetween('2026-11-01', THU), 4); eq(capsDate(THU), 'quinta · 5 de novembro'); });
    test('Datas curtas e longas (ano só quando é outro ano)', () => {
      eq(shortDate('2026-11-05', THU), '5 nov'); eq(shortDate('2027-02-28', THU), '28 fev 2027');
      eq(longDate('2026-11-21', THU), '21 de novembro'); ok(longDate('2027-03-02', THU).includes('2027'));
    });
    test('Saudação por hora', () => {
      eq(greeting(new Date(2026, 10, 5, 8)), 'Bom dia'); eq(greeting(new Date(2026, 10, 5, 15)), 'Boa tarde');
      eq(greeting(new Date(2026, 10, 5, 22)), 'Boa noite'); eq(greeting(new Date(2026, 10, 5, 3)), 'Boa noite');
    });

    // ---------- Agenda dos hábitos ----------
    group('Hábitos do dia');
    test('Diário aparece todos os dias', () => eq(todayList([H('a')], new Set(), THU).length, 1));
    test('Dias específicos (Seg/Qua/Sex)', () => {
      const h = H('x', { tipo: 'dias', dias: [1, 3, 5] });
      ok(isScheduled(h, '2026-11-02')); ok(!isScheduled(h, THU)); ok(isScheduled(h, '2026-11-06'));
    });
    test('Não aparece antes de ter sido criado', () => eq(todayList([H('a', undefined, { criadaEm: '2026-11-06' })], new Set(), THU).length, 0));
    test('Arquivado não aparece', () => eq(todayList([H('a', undefined, { arquivado: true })], new Set(), THU).length, 0));
    test('X por semana: aparece até cumprir a meta', () => {
      const h = H('g', { tipo: 'xPorSemana', n: 2 });
      eq(todayList([h], idxOf([['g', '2026-11-02']]), THU)[0].week, { count: 1, n: 2 });
      eq(todayList([h], idxOf([['g', '2026-11-02'], ['g', '2026-11-03']]), THU).length, 0);
    });
    test('X por semana: marcado hoje continua visível', () => {
      const l = todayList([H('g', { tipo: 'xPorSemana', n: 2 })], idxOf([['g', '2026-11-02'], ['g', THU]]), THU);
      eq(l.length, 1); ok(l[0].done);
    });
    test('X por semana recomeça à segunda', () => {
      const idx = idxOf([['g', '2026-11-02'], ['g', '2026-11-03']]);
      eq(weekCount(idx, H('g'), '2026-11-08'), 2); eq(weekCount(idx, H('g'), '2026-11-09'), 0);
    });
    test('Ordenação: por fazer primeiro', () => {
      const l = todayList([H('a'), H('b')], idxOf([['a', THU]]), THU);
      eq(l.map((i) => i.habit.id), ['b', 'a']);
    });
    test('Etiqueta da frequência', () => {
      eq(frequencyLabel(H('a')), 'Todos os dias'); eq(frequencyLabel(H('a', { tipo: 'dias', dias: [2, 4] })), 'Ter · Qui');
      eq(frequencyLabel(H('a', { tipo: 'xPorSemana', n: 3 })), '3× por semana');
    });

    // ---------- Sequências ----------
    group('Sequências (streaks)');
    test('Sem marcações = 0 dias', () => eq(streak(H('a'), new Set(), THU), { value: 0, unit: 'dias' }));
    test('5 dias seguidos até hoje', () => eq(streak(H('a'), idxOf(days('a', '2026-11-01', 5)), THU).value, 5));
    test('Hoje por fazer não quebra a sequência', () => eq(streak(H('a'), idxOf(days('a', '2026-11-01', 4)), THU).value, 4));
    test('Um dia falhado quebra a sequência', () => {
      const idx = idxOf([...days('a', '2026-10-28', 3), ...days('a', '2026-11-02', 3)]); // falhou 31/10 e 1/11
      eq(streak(H('a'), idx, '2026-11-04').value, 3);
    });
    test('Ontem falhado e hoje por fazer = 0', () => eq(streak(H('a'), idxOf([['a', '2026-11-03']]), THU).value, 0));
    test('Singular: 1 dia', () => eq(streak(H('a'), idxOf([['a', THU]]), THU), { value: 1, unit: 'dia' }));
    test('Dias específicos: dias não agendados não quebram', () => {
      const h = H('m', { tipo: 'dias', dias: [1, 3, 5] }); // seg, qua, sex
      const idx = idxOf([['m', '2026-10-26'], ['m', '2026-10-28'], ['m', '2026-10-30'], ['m', '2026-11-02'], ['m', '2026-11-04']]);
      eq(streak(h, idx, THU).value, 5); // quinta não está agendada
    });
    test('Não conta para trás da data de criação', () => eq(streak(H('a', undefined, { criadaEm: '2026-11-04' }), idxOf(days('a', '2026-11-01', 5)), THU).value, 2));
    test('X por semana: semanas seguidas com a meta cumprida', () => {
      const h = H('g', { tipo: 'xPorSemana', n: 2 });
      const idx = idxOf([['g', '2026-10-19'], ['g', '2026-10-20'], ['g', '2026-10-26'], ['g', '2026-10-27']]);
      eq(streak(h, idx, THU), { value: 2, unit: 'semanas' }); // semana atual ainda em curso não quebra
      eq(streak(h, idxOf([['g', '2026-10-26'], ['g', '2026-10-27'], ['g', '2026-11-02'], ['g', '2026-11-03']]), THU).value, 2);
    });
    test('Melhor sequência de sempre', () => {
      const idx = idxOf([...days('a', '2026-10-01', 10), ...days('a', '2026-10-20', 3)]);
      eq(bestStreak(H('a'), idx, THU), 10);
    });
    test('Últimos 7 dias: feito / falhado / por fazer / não agendado', () => {
      const h = H('m', { tipo: 'dias', dias: [1, 2, 3, 4, 5] });
      const l = last7(h, idxOf([['m', '2026-11-02'], ['m', '2026-11-03']]), THU);
      eq(l.map((d) => d.state), ['miss', 'off', 'off', 'done', 'done', 'miss', 'pending']);
    });
    test('Taxa de 30 dias (hoje por fazer não conta)', () => {
      const h = H('a', undefined, { criadaEm: '2026-11-01' });
      eq(rate(h, idxOf([['a', '2026-11-01'], ['a', '2026-11-02'], ['a', '2026-11-04']]), THU), 0.75);
      eq(rate(H('a', undefined, { criadaEm: THU }), new Set(), THU), null);
    });

    // ---------- Agenda ----------
    group('Agenda');
    const E = (id, data, inicio = '', fim = '', extra = {}) => ({ id, titulo: id, data, inicio, fim, ...extra });
    test('Evento único só no seu dia', () => { ok(occursOn(E('a', THU), THU)); ok(!occursOn(E('a', THU), '2026-11-06')); });
    test('Semanal: mesmo dia da semana, a partir da data', () => {
      const e = E('a', '2026-11-02', '10:00', '11:00', { repetir: 'semanal' });
      ok(occursOn(e, '2026-11-09')); ok(!occursOn(e, '2026-11-10')); ok(!occursOn(e, '2026-10-26'));
    });
    test('Diário e mensal', () => {
      ok(occursOn(E('a', '2026-11-01', '', '', { repetir: 'diario' }), THU));
      ok(occursOn(E('a', '2026-10-05', '', '', { repetir: 'mensal' }), THU)); ok(!occursOn(E('a', '2026-10-05', '', '', { repetir: 'mensal' }), '2026-11-06'));
    });
    test('Exceção apaga só uma ocorrência', () => {
      const e = E('a', '2026-11-02', '10:00', '11:00', { repetir: 'semanal', excecoes: ['2026-11-09'] });
      ok(!occursOn(e, '2026-11-09')); ok(occursOn(e, '2026-11-16'));
    });
    test('Ordem: dia todo primeiro, depois por hora', () => {
      const l = eventsOn([E('c', THU, '18:00'), E('a', THU), E('b', THU, '09:30')], THU);
      eq(l.map((e) => e.id), ['a', 'b', 'c']);
    });
    test('Duração (incluindo passar da meia-noite)', () => {
      eq(duration(E('a', THU, '10:00', '11:30')), 90); eq(duration(E('a', THU, '23:00', '01:00')), 120);
      eq(formatDuration(75), '1h 15min'); eq(formatDuration(60), '1h'); eq(formatDuration(45), '45min');
    });
    test('Linha "agora" e estados (passado / agora / próximo)', () => {
      const l = [E('a', THU, '09:00', '10:00'), E('b', THU, '12:00', '13:00'), E('c', THU, '18:00', '19:00'), E('d', THU, '20:00', '21:00')];
      eq(nowLineIndex(l, toMin('12:30')), 2);
      eq(timeStates(l, toMin('12:30')), ['past', 'now', 'next', 'later']);
      eq(nowLineIndex(l, toMin('22:00')), 4);
    });
    test('Ficheiro .ics válido', () => {
      const ics = toICS(E('x', THU, '10:00', '11:30', { repetir: 'semanal', local: 'Sala 2, piso 1' }));
      ok(ics.includes('BEGIN:VEVENT')); ok(ics.includes('RRULE:FREQ=WEEKLY')); ok(ics.includes('LOCATION:Sala 2\\, piso 1'));
      ok(toICS(E('y', THU)).includes('DTSTART;VALUE=DATE:20261105'));
    });

    // ---------- Finanças ----------
    group('Finanças');
    test('Ler valores em euros', () => {
      eq(parseAmount('12,5'), 1250); eq(parseAmount('12.50'), 1250); eq(parseAmount('1.234,56'), 123456);
      eq(parseAmount('€ 3'), 300); eq(parseAmount('0,99'), 99); eq(parseAmount('abc'), null); eq(parseAmount(''), null); eq(parseAmount('1,234'), null);
    });
    test('Formatar euros', () => {
      eq(fmtEUR(1250), '12,50 €'); eq(fmtEUR(-500), '−5,00 €'); eq(fmtEUR(1000, { sign: true }), '+10,00 €'); eq(fmtEUR(60000, { round: true }), '600 €');
    });
    const T = (tipo, valor, categoria, data) => ({ id: Math.random() + '', tipo, valor, categoria, data, ts: 1 });
    const TXS = [T('receita', 45000, 'mesada', '2026-11-01'), T('despesa', 1250, 'comida', '2026-11-02'), T('despesa', 4000, 'transporte', '2026-11-03'),
      T('despesa', 750, 'comida', THU), T('despesa', 9999, 'compras', '2026-10-30')];
    test('Resumo do mês (despesas, receitas, saldo, categorias)', () => {
      const s = monthSummary(TXS, '2026-11');
      eq([s.despesas, s.receitas, s.saldo], [6000, 45000, 39000]);
      eq(s.cats.map((c) => [c.id, c.total]), [['transporte', 4000], ['comida', 2000]]);
    });
    test('Gasto num dia e saldo entre datas', () => { eq(spentOn(TXS, THU), 750); eq(balanceBetween(TXS, '2026-11-02', THU), -6000); });
    test('Último dia do mês', () => { eq(lastDayOfMonth('2026-02'), 28); eq(lastDayOfMonth('2028-02'), 29); eq(lastDayOfMonth('2026-11'), 30); });
    test('Ritmo do orçamento', () => {
      const p = budgetPace(26000, 60000, '2026-11-05'); // faltam 26 dias (5 a 30)
      eq(p.daysLeft, 26); eq(p.left, 34000); eq(p.perDay, 1307); ok(!p.over);
      ok(budgetPace(70000, 60000, '2026-11-05').over);
    });

    // ---------- Metas ----------
    group('Metas');
    const G = (g) => ({ id: g.id || 'g', medida: 'numero', modo: 'manual', unidade: '', registos: [], ...g });
    test('Períodos: mês e semana', () => {
      eq(periodRange(G({ tipo: 'mes', periodo: '2026-11' })), ['2026-11-01', '2026-11-30']);
      eq(periodRange(G({ tipo: 'semana', periodo: '2026-11-02' })), ['2026-11-02', '2026-11-08']);
      eq(currentPeriod('semana', THU), '2026-11-02'); eq(currentPeriod('mes', THU), '2026-11');
      eq(shiftPeriod('mes', '2026-12', 1), '2027-01'); eq(shiftPeriod('semana', '2026-11-02', -1), '2026-10-26');
      eq(weekLabel('2026-11-02'), 'Semana 45');
    });
    test('Manual: soma dos registos', () => {
      const p = progress(G({ tipo: 'semana', periodo: '2026-11-02', alvo: 100, registos: [{ valor: 40 }, { valor: 22 }] }));
      eq([p.value, p.target, p.done], [62, 100, false]); eq(p.pct, 0.62);
    });
    test('Mensal soma as semanais da mesma unidade', () => {
      const m = G({ id: 'm', tipo: 'mes', periodo: '2026-11', alvo: 300, unidade: '€', registos: [{ valor: 50 }] });
      const w1 = G({ id: 'w1', tipo: 'semana', periodo: '2026-11-02', alvo: 75, unidade: '€', paiId: 'm', registos: [{ valor: 60 }] });
      const w2 = G({ id: 'w2', tipo: 'semana', periodo: '2026-11-02', alvo: 100, unidade: 'páginas', paiId: 'm', registos: [{ valor: 99 }] });
      eq(progress(m, { goals: [m, w1, w2] }).value, 110);
    });
    test('De um hábito: conta marcações no período', () => {
      const checks = [{ habitId: 'gym', data: '2026-11-02' }, { habitId: 'gym', data: '2026-11-04' }, { habitId: 'gym', data: '2026-10-30' }, { habitId: 'x', data: THU }];
      eq(progress(G({ tipo: 'semana', periodo: '2026-11-02', alvo: 4, modo: 'habito', habitId: 'gym' }), { checks }).value, 2);
      eq(progress(G({ tipo: 'mes', periodo: '2026-10', alvo: 16, modo: 'habito', habitId: 'gym' }), { checks }).value, 1);
    });
    test('Poupança: receitas − despesas no período (€)', () => {
      eq(progress(G({ tipo: 'mes', periodo: '2026-11', alvo: 300, modo: 'poupanca', unidade: '€' }), { txs: TXS }).value, 390);
      ok(progress(G({ tipo: 'mes', periodo: '2026-11', alvo: 300, modo: 'poupanca' }), { txs: TXS }).done);
    });
    test('Sim/Não', () => {
      eq(progress(G({ medida: 'feito', feito: false, tipo: 'mes', periodo: '2026-11' })).done, false);
      eq(progress(G({ medida: 'feito', feito: true, tipo: 'mes', periodo: '2026-11' })).pct, 1);
    });
    test('Barra nunca passa de 100% nem fica negativa', () => {
      eq(progress(G({ tipo: 'semana', periodo: '2026-11-02', alvo: 10, registos: [{ valor: 25 }] })).pct, 1);
      eq(progress(G({ tipo: 'semana', periodo: '2026-11-02', alvo: 10, registos: [{ valor: -5 }] })).pct, 0);
    });
    test('Meta da semana em destaque: a primeira por cumprir', () => {
      const a = G({ id: 'a', tipo: 'semana', periodo: '2026-11-02', alvo: 1, registos: [{ valor: 1 }], ordem: 0 });
      const b = G({ id: 'b', tipo: 'semana', periodo: '2026-11-02', alvo: 5, ordem: 1 });
      eq(featuredWeekly([a, b], THU, {}).id, 'b'); eq(featuredWeekly([], THU, {}), null);
      eq(goalsFor([a, b, G({ id: 'c', tipo: 'mes', periodo: '2026-11' })], 'semana', '2026-11-02').length, 2);
    });

    // ---------- Tarefas ----------
    group('Tarefas');
    const TD = (id, data, extra = {}) => ({ id, titulo: id, data, hora: '', prioridade: false, feito: false, ordem: 0, ...extra });
    test('Tarefas do dia: importantes primeiro, depois por hora, feitas no fim', () => {
      const l = todosOn([TD('a', THU, { hora: '15:00' }), TD('b', THU, { feito: true }), TD('c', THU, { prioridade: true }), TD('d', THU, { hora: '09:00' })], THU, THU);
      eq(l.map((x) => x.todo.id), ['c', 'd', 'a', 'b']);
    });
    test('Atrasadas aparecem hoje (e só hoje), antes das feitas', () => {
      const todos = [TD('velha', '2026-11-03'), TD('hoje', THU), TD('feita', THU, { feito: true }), TD('velhaFeita', '2026-11-02', { feito: true })];
      const l = todosOn(todos, THU, THU);
      eq(l.map((x) => [x.todo.id, x.atrasada]), [['hoje', false], ['velha', true], ['feita', false]]);
      eq(todosOn(todos, '2026-11-06', THU).length, 0);
      eq(overdue(todos, THU).map((t) => t.id), ['velha']);
    });
    test('Sem data: só as por fazer', () => eq(inbox([TD('a', null), TD('b', null, { feito: true }), TD('c', THU)]).map((t) => t.id), ['a']));
    test('Repetição: próxima data', () => {
      eq(nextDate(THU, 'diario'), '2026-11-06'); eq(nextDate(THU, 'semanal'), '2026-11-12');
      eq(nextDate('2026-01-31', 'mensal'), '2026-02-28'); eq(nextDate('2026-12-15', 'mensal'), '2027-01-15'); eq(nextDate(THU, 'nunca'), null);
    });
    test('Prioridades do dia e passos', () => {
      eq(prioritiesOn([TD('a', THU, { prioridade: true }), TD('b', THU)], THU).map((t) => t.id), ['a']);
      eq(stepsLabel({ passos: [{ feito: true }, { feito: false }, { feito: false }] }), '1/3'); eq(stepsLabel({}), '');
    });

    group('Escrita rápida');
    const P = (txt, base = THU) => { const r = parseQuick(txt, THU, base); return [r.titulo, r.data, r.hora, r.prioridade]; };
    test('"amanhã 15h ligar ao banco"', () => eq(P('amanhã 15h ligar ao banco'), ['Ligar ao banco', '2026-11-06', '15:00', false]));
    test('"ligar ao banco amanha às 9h30" (sem acento, hora no fim)', () => eq(P('ligar ao banco amanha às 9h30'), ['Ligar ao banco', '2026-11-06', '09:30', false]));
    test('"! entregar trabalho sexta"', () => eq(P('! entregar trabalho sexta'), ['Entregar trabalho', '2026-11-06', '', true]));
    test('Dia da semana: "segunda" = próxima segunda; "quinta" numa quinta = semana seguinte', () => {
      eq(P('dentista na segunda')[1], '2026-11-09'); eq(P('reunião quinta')[1], '2026-11-12'); eq(P('festa no sábado')[1], '2026-11-07');
    });
    test('Datas: "12/11", "dia 20", "depois de amanhã", "hoje"', () => {
      eq(P('pagar renda 12/11')[1], '2026-11-12'); eq(P('pagar renda 1/11')[1], '2027-11-01');
      eq(P('consulta dia 20')[1], '2026-11-20'); eq(P('consulta dia 2')[1], '2026-12-02');
      eq(P('ir ao banco depois de amanhã')[1], '2026-11-07'); eq(P('hoje lavar roupa', null)[1], THU);
    });
    test('Horas: "18:45", "às 9"', () => { eq(P('jantar 18:45')[2], '18:45'); eq(P('treino às 9')[2], '09:00'); });
    test('Sem data por omissão (caixa) e hora puxa para hoje', () => {
      eq(P('ver documentário', null), ['Ver documentário', null, '', false]);
      eq(P('ligar 15h', null)[1], THU);
    });
    test('Texto normal não é confundido', () => eq(P('ler 20 páginas'), ['Ler 20 páginas', THU, '', false]));

    group('Contagens e avisos');
    test('Próxima ocorrência e contagens decrescentes', () => {
      eq(nextOccurrence(E('a', '2026-11-20'), THU), '2026-11-20'); eq(nextOccurrence(E('a', '2026-11-01'), THU), null);
      eq(nextOccurrence(E('b', '2001-03-15', '', '', { repetir: 'anual' }), THU), '2027-03-15');
      const c = countdowns([E('x', '2026-11-17', '', '', { contagem: true }), E('y', THU, '', '', { contagem: true }), E('z', '2026-11-10')], THU);
      eq(c.map((k) => [k.ev.id, k.dias]), [['y', 0], ['x', 12]]);
    });
    const N = (extra) => nudges({ today: THU, hour: 21, journalToday: true, plannedTomorrow: true, weekGoal: null, budgetPct: null,
      lastBackup: '2026-11-04T10:00:00Z', hasData: true, overdueCount: 0, dismissed: {}, ...extra }, 9).map((n) => n.id);
    test('Avisos: nada a dizer → nada', () => eq(N({}), []));
    test('Avisos: atrasadas, planear, diário (à noite)', () => {
      eq(N({ overdueCount: 2, plannedTomorrow: false, journalToday: false }), ['atrasadas', 'planear', 'diario']);
      eq(N({ hour: 10, plannedTomorrow: false, journalToday: false }), []);
    });
    test('Avisos: meta só a partir de sexta; orçamento ≥ 80%; backup ≥ 7 dias', () => {
      eq(N({ weekGoal: { titulo: 'x', falta: 1 } }), []);
      eq(N({ today: '2026-11-06', weekGoal: { titulo: 'x', falta: 1 } }), ['meta']);
      eq(N({ budgetPct: 0.85 }), ['orcamento']);
      eq(N({ lastBackup: '2026-10-20T10:00:00Z' }), ['backup']); eq(N({ lastBackup: null }), ['backup']); eq(N({ lastBackup: null, hasData: false }), []);
    });
    test('Avisos fechados hoje não voltam; máximo 2', () => {
      eq(N({ overdueCount: 1, dismissed: { atrasadas: THU } }), []);
      eq(nudges({ today: THU, hour: 21, overdueCount: 1, plannedTomorrow: false, journalToday: false, hasData: false, dismissed: {} }).length, 2);
    });

    group('Hábitos: estados dos dias');
    test('Estado de cada dia (feito, falhado, hoje por fazer, folga, futuro, antes de existir)', () => {
      const h = H('m', { tipo: 'dias', dias: [1, 3, 4] }, { criadaEm: '2026-11-02' }); // seg, qua, qui
      const idx = idxOf([['m', '2026-11-02']]);
      eq(['2026-11-01', '2026-11-02', '2026-11-03', '2026-11-04', THU, '2026-11-06'].map((d) => dayState(h, idx, d, THU)),
        ['before', 'done', 'off', 'miss', 'pending', 'future']);
    });
    test('X por semana: dias sem marcação são folga, não falha', () => {
      const h = H('g', { tipo: 'xPorSemana', n: 3 });
      eq(dayState(h, new Set(), '2026-11-03', THU), 'off'); eq(dayState(h, new Set(), THU, THU), 'pending');
    });
    test('Resumo do dia, total e maior sequência ativa', () => {
      const a = H('a'), b = H('b');
      const idx = idxOf([...days('a', '2026-11-01', 5), ['b', '2026-11-04']]);
      eq(todaySummary([a, b], idx, THU), { total: 2, done: 1 });
      eq(totalDone(a, [{ habitId: 'a' }, { habitId: 'a' }, { habitId: 'b' }]), 2);
      eq(bestActive([a, b], idx, THU).habit.id, 'a'); eq(bestActive([b], new Set(), THU), null);
    });

    // ---------- Objetivos ----------
    group('Objetivos (longo prazo)');
    const OB = (x) => ({ id: 'o', titulo: 'o', registos: [], marcos: [], inicio: '2026-11-01', prazo: '2026-12-31', ...x }); // 60 dias
    test('Acumular: soma registos + metas ligadas com a mesma unidade', () => {
      const o = OB({ tipo: 'acumular', alvo: 12, unidade: 'livros', registos: [{ data: '2026-11-02', valor: 2 }] });
      const goals = [
        { objetivoId: 'o', medida: 'numero', modo: 'manual', unidade: 'livros', registos: [{ data: '2026-11-04', valor: 1 }] },
        { objetivoId: 'o', medida: 'numero', modo: 'manual', unidade: 'páginas', registos: [{ data: '2026-11-04', valor: 100 }] },
      ];
      const p = objProgress(o, { goals }, THU);
      eq([p.value, p.target, p.done], [3, 12, false]); eq(p.pct, 0.25);
    });
    test('Poupança: valor inicial + receitas − despesas desde o início', () => {
      const o = OB({ tipo: 'poupanca', inicial: 500, alvo: 1000, unidade: '€' });
      const txs = [T('receita', 30000, 'x', '2026-11-02'), T('despesa', 5000, 'x', '2026-11-03'), T('receita', 99900, 'x', '2026-10-30')];
      eq(objProgress(o, { txs }, THU).value, 750);
      eq(series(o, { txs }, THU).map((p) => p.v), [500, 800, 750, 750, 750]);
    });
    test('Medição a descer (peso): direção, progresso e cumprido', () => {
      const o = OB({ tipo: 'medicao', inicial: 80, alvo: 75, registos: [{ data: '2026-11-03', valor: 78 }] });
      eq(direction(o), -1);
      const p = objProgress(o, {}, THU); eq([p.value, p.pct], [78, 0.4]);
      ok(objProgress({ ...o, registos: [{ data: THU, valor: 74.8 }] }, {}, THU).done);
    });
    test('Ritmo: esperado hoje, à frente/atrás e quanto falta por dia', () => {
      // 60 dias, 4 passados (1→5 nov), objetivo 600 → esperado 40
      const o = OB({ tipo: 'acumular', alvo: 600, registos: [{ data: '2026-11-02', valor: 50 }] });
      const p = pace(o, {}, THU);
      eq([p.elapsed, p.daysLeft, p.expected, p.diff, p.ahead], [4, 56, 40, 10, true]);
      eq(p.remaining, 550); eq(p.perDay, 9.82); eq(p.perWeek, 68.75);
      const q = pace({ ...o, registos: [{ data: '2026-11-02', valor: 10 }] }, {}, THU);
      ok(!q.ahead); eq(q.diff, -30);
    });
    test('Previsão: só depois de 1 semana e se estiver a andar no sentido certo', () => {
      const o = OB({ tipo: 'acumular', alvo: 100, registos: [{ data: '2026-11-02', valor: 20 }] });
      eq(pace(o, {}, THU).forecast, null); // só 4 dias
      eq(pace(o, {}, '2026-11-11').forecast, '2026-12-21'); // 20 em 10 dias → faltam 80 a 2/dia = 40 dias
      eq(pace(OB({ tipo: 'medicao', inicial: 80, alvo: 75, registos: [{ data: '2026-11-09', valor: 81 }] }), {}, '2026-11-11').forecast, null);
    });
    test('Atraso: prazo passou sem cumprir', () => ok(pace(OB({ tipo: 'acumular', alvo: 10, prazo: '2026-11-03' }), {}, THU).late));
    test('Marcos atingidos com data (numéricos) e passos (sim/não)', () => {
      const o = OB({ tipo: 'acumular', alvo: 10, registos: [{ data: '2026-11-02', valor: 3 }, { data: '2026-11-04', valor: 3 }],
        marcos: [{ id: 'b', valor: 5 }, { id: 'a', valor: 2 }, { id: 'c', valor: 10 }] });
      eq(milestones(o, {}, THU).map((m) => [m.id, m.reached, m.date]), [['a', true, '2026-11-02'], ['b', true, '2026-11-04'], ['c', false, null]]);
      const f = OB({ tipo: 'feito', marcos: [{ id: 'x', titulo: 'Código', feito: true }, { id: 'y', titulo: 'Exame', feito: false }] });
      eq(objProgress(f, {}, THU).pct, 0.5); eq(milestones(f, {}, THU).map((m) => m.reached), [true, false]);
    });
    test('Marcos sugeridos (25/50/75%)', () => {
      eq(suggestMilestones({ tipo: 'poupanca', inicial: 0, alvo: 3000 }), [750, 1500, 2250]);
      eq(suggestMilestones({ tipo: 'medicao', inicial: 80, alvo: 75 }), [79, 77.5, 76.5]);
    });
    test('Ordem: ativos por prazo, cumpridos no fim', () => {
      const a = OB({ id: 'a', tipo: 'acumular', alvo: 1, prazo: '2027-03-01' });
      const b = OB({ id: 'b', tipo: 'acumular', alvo: 1, prazo: '2026-12-01' });
      const c = OB({ id: 'c', tipo: 'feito', feito: true, prazo: '2026-11-20' });
      eq(sortObjectives([a, c, b], {}, THU).map((o) => o.id), ['b', 'a', 'c']);
    });
    test('Histórico de metas cumpridas por mês', () => {
      const G2 = (periodo, done) => ({ tipo: 'mes', periodo, medida: 'feito', feito: done });
      const h = history([G2('2026-10', true), G2('2026-10', false), G2('2026-11', true)], 'mes', ['2026-09', '2026-10', '2026-11'], {});
      eq(h.map((x) => [x.total, x.done, x.pct]), [[0, 0, null], [2, 1, 0.5], [1, 1, 1]]);
    });

    group('Hábitos 2.0');
    const CK = (habitId, data, extra = {}) => ({ habitId, data, ...extra });
    const IX = (list) => makeIndex(list);
    test('Quantidade: feito só ao atingir o alvo; parcial no meio', () => {
      const h = H('agua', undefined, { quantidade: { alvo: 8, unidade: 'copos', passo: 1 } });
      const idx = IX([CK('agua', '2026-11-04', { valor: 8 }), CK('agua', THU, { valor: 3 })]);
      eq(dayState(h, idx, '2026-11-04', THU), 'done'); eq(dayState(h, idx, THU, THU), 'partial'); eq(qtyOn(idx, h, THU), 3);
      eq(todayList([h], idx, THU)[0].done, false); eq(todayList([h], idx, THU)[0].qty, 3);
      eq(totalDone(h, [CK('agua', 'a', { valor: 8 }), CK('agua', 'b', { valor: 2 })]), 1);
    });
    test('Versão mínima conta como feito (estado "min")', () => {
      const h = H('ler', undefined, { minimo: '1 página' });
      const idx = IX([CK('ler', '2026-11-03'), CK('ler', '2026-11-04', { min: true })]);
      eq(dayState(h, idx, '2026-11-04', THU), 'min'); eq(streak(h, idx, THU).value, 2);
      ok(todayList([h], IX([CK('ler', THU, { min: true })]), THU)[0].min);
    });
    test('Nunca falhar duas vezes: uma falha isolada não quebra, duas sim', () => {
      const tol = H('t', undefined, { tolerancia: true, criadaEm: '2026-10-25' });
      // feito 30, 31, (falha 1/11), 2, 3, 4 → com tolerância: 5 dias
      const idx = IX(['2026-10-30', '2026-10-31', '2026-11-02', '2026-11-03', '2026-11-04'].map((d) => CK('t', d)));
      eq(streak(tol, idx, THU).value, 5); eq(streak({ ...tol, tolerancia: false }, idx, THU).value, 3);
      // duas falhas seguidas (1 e 2/11) quebram
      const idx2 = IX(['2026-10-30', '2026-10-31', '2026-11-03', '2026-11-04'].map((d) => CK('t', d)));
      eq(streak(tol, idx2, THU).value, 2);
      eq(bestStreak(tol, idx, THU), 5);
    });
    test('Em risco: falhou o último dia e hoje ainda não fez', () => {
      const tol = H('t', undefined, { tolerancia: true });
      ok(atRisk(tol, IX([CK('t', '2026-11-03')]), THU));
      ok(!atRisk(tol, IX([CK('t', '2026-11-04')]), THU));
      ok(!atRisk({ ...tol, tolerancia: false }, IX([CK('t', '2026-11-03')]), THU));
    });
    test('Hábito a evitar: dias limpos desde o último deslize', () => {
      const h = H('redes', undefined, { tipo: 'evitar', criadaEm: '2026-10-20' });
      const idx = IX([CK('redes', '2026-10-28', { deslize: true })]);
      eq(streak(h, idx, THU).value, 8); // 29/10 → 5/11
      eq(dayState(h, idx, '2026-10-28', THU), 'slip'); eq(dayState(h, idx, THU, THU), 'clean');
      eq(bestStreak(h, idx, THU), 8); eq(rate(h, idx, THU, 10), 0.9);
      eq(todayList([h], idx, THU).length, 0); eq(avoidList([h], THU).length, 1);
    });
    test('Pausa: dias em pausa não contam nem quebram', () => {
      const h = H('p', undefined, { pausas: [{ de: '2026-11-01', ate: '2026-11-03' }] });
      const idx = IX(['2026-10-30', '2026-10-31', '2026-11-04'].map((d) => CK('p', d)));
      ok(isPaused(h, '2026-11-02')); ok(!isScheduled(h, '2026-11-02'));
      eq(streak(h, idx, THU).value, 3); eq(dayState(h, idx, '2026-11-02', THU), 'paused');
      eq(todayList([{ ...h, pausas: [{ de: THU, ate: null }] }], idx, THU).length, 0);
    });
    test('Taxa por dia da semana e dia mais difícil', () => {
      const h = H('d', undefined, { criadaEm: '2026-08-01' });
      const days = []; for (let d = '2026-08-10'; d < THU; d = addDays(d, 1)) if (weekday(d) !== 5) days.push(CK('d', d));
      const wr = weekdayRates(h, IX(days), THU);
      eq(wr.find((x) => x.weekday === 5).pct, 0); eq(wr.find((x) => x.weekday === 1).pct, 1);
      eq(weakestDay(wr).weekday, 5); eq(weakestDay(wr.map((x) => ({ ...x, pct: 1 }))), null);
    });
    test('Taxa por mês e consistência do dia', () => {
      const h = H('m', undefined, { criadaEm: '2026-10-01' });
      const idx = IX(Array.from({ length: 31 }, (_, i) => CK('m', `2026-10-${String(i + 1).padStart(2, '0')}`)).filter((_, i) => i % 2 === 0));
      const mr = monthRates(h, idx, THU, 3);
      eq(mr.map((x) => x.month), ['2026-09', '2026-10', '2026-11']); eq(mr[0].pct, null); eq(Math.round(mr[1].pct * 100), 52);
      const a = H('a'), b = H('b');
      eq(dayScore([a, b, H('c', undefined, { tipo: 'evitar' })], IX([CK('a', THU)]), THU), 0.5);
    });

    // ---------- Frases ----------
    group('Frases e diário');
    test('A frase do dia é estável (não muda a cada toque)', () => eq(trigger(THU, { hour: 10, slot: 'x' }), trigger(THU, { hour: 10, slot: 'x' })));
    test('Frase de manhã vem das gerais ou das de manhã', () => {
      const t = trigger(THU, { hour: 8, slot: 'hoje' }); ok([...TRIGGERS.geral, ...TRIGGERS.manha].includes(t));
    });
    test('As tuas frases entram na mistura', () => {
      let found = false;
      for (let i = 0; i < 400 && !found; i++) found = trigger(addDays(THU, i), { hour: 15, custom: ['frase minha'] }) === 'frase minha';
      ok(found, 'a frase personalizada nunca apareceu');
    });
    test('Pergunta do diário é estável por dia', () => { eq(journalPrompt(THU), journalPrompt(THU)); ok(JOURNAL_PROMPTS.includes(journalPrompt(THU))); });
    test('Frases variam ao longo dos dias', () => ok(new Set(Array.from({ length: 30 }, (_, i) => trigger(addDays(THU, i), { hour: 15 }))).size > 10));
    test('Hash determinístico', () => eq(hash('abc'), hash('abc')));

    // ---------- Migração ----------
    group('Migração da versão 1');
    test('Hábitos criados por ti passam; exemplos e missões não', () => {
      const tasks = [
        { id: 'h1', titulo: 'Ler', tipo: 'habito', recorrencia: { tipo: 'diario' }, criadaEm: '2026-11-01' },
        { id: 'h2', titulo: 'Ex', tipo: 'habito', seed: true },
        { id: 'm1', titulo: 'CV', tipo: 'pontual', data: THU },
      ];
      const log = [
        { tipo: 'concluir', taskId: 'h1', data: '2026-11-02', ts: 1 },
        { tipo: 'concluir', taskId: 'h1', data: '2026-11-02', ts: 2 }, // duplicado
        { tipo: 'concluir', taskId: 'h2', data: '2026-11-02', ts: 3 },
        { tipo: 'concluir', taskId: 'm1', data: THU, ts: 4 },
      ];
      const r = migrateV1(tasks, log);
      eq(r.habits.map((h) => [h.id, h.nome]), [['h1', 'Ler']]);
      eq(r.checks.map((c) => c.id), [checkId('h1', '2026-11-02')]);
    });

    // ---------- Correr ----------
    let pass = 0, fail = 0;
    const out = document.getElementById('out');
    for (const g of groups) {
      const items = g.tests.map((t) => {
        try { t.fn(); pass++; return `<li class="ok">✓ ${t.name}</li>`; }
        catch (e) { fail++; console.error(t.name, e); return `<li class="fail">✗ ${t.name}<pre>${e.message}</pre></li>`; }
      });
      out.insertAdjacentHTML('beforeend', `<h2>${g.name}</h2><ul>${items.join('')}</ul>`);
    }
    const s = document.getElementById('summary');
    s.textContent = fail ? `${fail} falharam · ${pass} passaram` : `Todos os ${pass} testes passaram ✓`;
    s.className = fail ? 'fail' : 'ok';
    window.__testResults = { pass, fail };
  </script>
</body>
