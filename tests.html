<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LevelUp · Testes</title>
  <style>
    body { font: 15px/1.4 -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; background: #f2f2f7; color: #000; }
    h1 { font-size: 26px; margin: 8px 0 4px; }
    #summary { font-weight: 700; margin-bottom: 12px; }
    .ok { color: #1f8a3b; } .fail { color: #d70015; }
    li { background: #fff; list-style: none; margin: 0 0 6px; padding: 10px 12px; border-radius: 10px; }
    ul { padding: 0; }
    pre { white-space: pre-wrap; margin: 4px 0 0; font-size: 12px; }
    h2 { font-size: 13px; text-transform: uppercase; color: #6c6c70; margin: 20px 4px 8px; }
  </style>
</head>
<body>
  <h1>Testes da LevelUp</h1>
  <div id="summary">A correr…</div>
  <div id="out"></div>

  <script type="module">
    import { xpForNext, levelFromXp, xpForTask, coinsForXp, totalXp, xpByArea, xpOnDate } from './js/engine/xp.js';
    import { toKey, fromKey, addDays, weekday, weekStart, weekKey, monthKey, daysBetween } from './js/engine/dates.js';
    import { buildDay, isDoneOn, weekCount, isHabitScheduled } from './js/engine/schedule.js';

    const groups = [];
    let current;
    const group = (name) => groups.push((current = { name, tests: [] }));
    const test = (name, fn) => current.tests.push({ name, fn });
    const eq = (a, b, msg = '') => {
      const A = JSON.stringify(a), B = JSON.stringify(b);
      if (A !== B) throw new Error(`${msg}esperado ${B}, obtido ${A}`);
    };
    const ok = (v, msg = 'esperado verdadeiro') => { if (!v) throw new Error(msg); };

    // ---------- XP e níveis ----------
    group('XP e níveis');
    test('XP para o próximo nível = 100 × n^1.5', () => {
      eq(xpForNext(1), 100); eq(xpForNext(2), 283); eq(xpForNext(4), 800); eq(xpForNext(10), 3162);
    });
    test('0 XP = nível 1', () => eq(levelFromXp(0), { level: 1, xpInLevel: 0, xpForNext: 100, progress: 0 }));
    test('99 XP = nível 1', () => eq(levelFromXp(99).level, 1));
    test('100 XP = nível 2 (exatamente na fronteira)', () => { eq(levelFromXp(100).level, 2); eq(levelFromXp(100).xpInLevel, 0); });
    test('382 XP = nível 2, 282 dentro do nível', () => { eq(levelFromXp(382).level, 2); eq(levelFromXp(382).xpInLevel, 282); });
    test('383 XP = nível 3', () => eq(levelFromXp(383).level, 3));
    test('XP negativo ou inválido não rebenta', () => { eq(levelFromXp(-50).level, 1); eq(levelFromXp(undefined).level, 1); });
    test('Nível é monótono (mais XP nunca baixa o nível)', () => {
      let prev = 1;
      for (let xp = 0; xp < 200000; xp += 137) { const l = levelFromXp(xp).level; ok(l >= prev, `baixou em ${xp}`); prev = l; }
    });
    test('Soma dos XP até ao nível 10 bate certo', () => {
      let sum = 0; for (let n = 1; n < 10; n++) sum += xpForNext(n);
      eq(levelFromXp(sum).level, 10); eq(levelFromXp(sum - 1).level, 9);
    });
    test('XP por dificuldade: 10 / 25 / 50 / 100', () => {
      eq(['facil', 'media', 'dificil', 'epica'].map((d) => xpForTask({ dificuldade: d })), [10, 25, 50, 100]);
    });
    test('Prioridade do dia vale XP a dobrar', () => eq(xpForTask({ dificuldade: 'dificil' }, { priority: true }), 100));
    test('Valores de XP personalizados', () => eq(xpForTask({ dificuldade: 'facil' }, { values: { facil: 15 } }), 15));
    test('Moedas: 1 por cada 5 XP', () => { eq(coinsForXp(10), 2); eq(coinsForXp(25), 5); eq(coinsForXp(100), 20); });
    test('Totais a partir do histórico', () => {
      const log = [{ xp: 10, areaId: 'a', data: '2026-11-05' }, { xp: 25, areaId: 'b', data: '2026-11-05' }, { xp: 50, areaId: 'a', data: '2026-11-04' }];
      eq(totalXp(log), 85); eq(xpByArea(log), { a: 60, b: 25 }); eq(xpOnDate(log, '2026-11-05'), 35);
    });

    // ---------- Datas ----------
    group('Datas');
    test('toKey / fromKey ida e volta', () => eq(toKey(fromKey('2026-02-28')), '2026-02-28'));
    test('addDays muda de mês e de ano', () => { eq(addDays('2026-01-31', 1), '2026-02-01'); eq(addDays('2026-12-31', 1), '2027-01-01'); eq(addDays('2026-03-01', -1), '2026-02-28'); });
    test('addDays atravessa a mudança de hora (DST)', () => { eq(addDays('2026-03-28', 2), '2026-03-30'); eq(addDays('2026-10-24', 2), '2026-10-26'); });
    test('Dia da semana: 1 = segunda, 7 = domingo', () => { eq(weekday('2026-11-02'), 1); eq(weekday('2026-11-05'), 4); eq(weekday('2026-11-08'), 7); });
    test('A semana começa à segunda', () => { eq(weekStart('2026-11-08'), '2026-11-02'); eq(weekStart('2026-11-02'), '2026-11-02'); });
    test('Semana ISO', () => { eq(weekKey('2026-11-05'), '2026-W45'); eq(weekKey('2026-01-01'), '2026-W01'); eq(weekKey('2024-12-30'), '2025-W01'); eq(weekKey('2021-01-03'), '2020-W53'); });
    test('Mês e diferença de dias', () => { eq(monthKey('2026-11-05'), '2026-11'); eq(daysBetween('2026-11-01', '2026-11-05'), 4); });

    // ---------- Agenda do dia ----------
    group('Hábitos e missões do dia');
    const H = (id, rec, extra = {}) => ({ id, titulo: id, tipo: 'habito', areaId: 'a', dificuldade: 'media', recorrencia: rec, ...extra });
    const M = (id, data) => ({ id, titulo: id, tipo: 'pontual', areaId: 'a', dificuldade: 'facil', data });
    const C = (taskId, data) => ({ tipo: 'concluir', taskId, data, xp: 10 });
    const ids = (items) => items.map((i) => i.task.id);
    const THU = '2026-11-05';

    test('Hábito diário aparece todos os dias', () => eq(ids(buildDay([H('d', { tipo: 'diario' })], [], THU).habits), ['d']));
    test('Hábito em dias específicos', () => {
      const t = H('x', { tipo: 'dias', dias: [1, 3, 5] });
      ok(isHabitScheduled(t, '2026-11-02')); ok(!isHabitScheduled(t, THU)); ok(isHabitScheduled(t, '2026-11-06'));
    });
    test('Hábito não aparece antes de ter sido criado', () => eq(buildDay([H('d', { tipo: 'diario' }, { criadaEm: '2026-11-06' })], [], THU).total, 0));
    test('X por semana: aparece até atingir a meta', () => {
      const t = H('g', { tipo: 'xPorSemana', n: 2 });
      eq(buildDay([t], [C('g', '2026-11-02')], THU).habits[0].week, { count: 1, n: 2 });
      eq(buildDay([t], [C('g', '2026-11-02'), C('g', '2026-11-03')], THU).total, 0);
    });
    test('X por semana: concluído hoje continua visível como feito', () => {
      const d = buildDay([H('g', { tipo: 'xPorSemana', n: 2 })], [C('g', '2026-11-02'), C('g', THU)], THU);
      eq(d.habits.length, 1); ok(d.habits[0].done);
    });
    test('X por semana: recomeça na segunda-feira', () => {
      const log = [C('g', '2026-11-02'), C('g', '2026-11-03')];
      eq(weekCount(log, 'g', '2026-11-08'), 2); eq(weekCount(log, 'g', '2026-11-09'), 0);
    });
    test('Missão de hoje aparece; a de amanhã vai para "Próximos"', () => {
      const d = buildDay([M('a', THU), M('b', '2026-11-06'), M('c', '2026-11-30')], [], THU);
      eq(ids(d.missions), ['a']); eq(ids(d.upcoming), ['b']);
    });
    test('Missão atrasada por fazer aparece como atrasada', () => {
      const d = buildDay([M('a', '2026-11-03')], [], THU);
      ok(d.missions[0].overdue);
    });
    test('Missão concluída só aparece no dia em que foi concluída', () => {
      const tasks = [M('a', '2026-11-03')];
      const log = [C('a', '2026-11-04')];
      eq(buildDay(tasks, log, '2026-11-04').missions.length, 1);
      eq(buildDay(tasks, log, THU).missions.length, 0);
    });
    test('Conclusões: contagem do dia e ordenação (por fazer primeiro)', () => {
      const d = buildDay([H('a', { tipo: 'diario' }), H('b', { tipo: 'diario' })], [C('a', THU)], THU);
      eq(d.done, 1); eq(d.total, 2); eq(ids(d.habits), ['b', 'a']); ok(isDoneOn([C('a', THU)], 'a', THU));
    });
    test('Missões arquivadas não aparecem', () => eq(buildDay([{ ...M('a', THU), arquivada: true }], [], THU).total, 0));

    group('Streaks');
    test('Streaks e escudo: chegam na Fase 3 (testes nessa fase)', () => {});

    // ---------- Correr ----------
    let pass = 0, fail = 0;
    const out = document.getElementById('out');
    for (const g of groups) {
      const items = g.tests.map((t) => {
        try { t.fn(); pass++; return `<li class="ok">✓ ${t.name}</li>`; }
        catch (e) { fail++; console.error(t.name, e); return `<li class="fail">✗ ${t.name}<pre>${e.message}</pre></li>`; }
      });
      out.insertAdjacentHTML('beforeend', `<h2>${g.name}</h2><ul>${items.join('')}</ul>`);
    }
    const s = document.getElementById('summary');
    s.textContent = fail ? `${fail} falharam · ${pass} passaram` : `Todos os ${pass} testes passaram ✓`;
    s.className = fail ? 'fail' : 'ok';
    window.__testResults = { pass, fail };
  </script>
</body>
</html>
