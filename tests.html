<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LevelUp · Testes</title>
  <style>
    body { font: 15px/1.4 -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; background: #f2f2f7; color: #000; }
    h1 { font-size: 26px; margin: 8px 0 4px; }
    #summary { font-weight: 700; margin-bottom: 12px; }
    .ok { color: #1f8a3b; } .fail { color: #d70015; }
    li { background: #fff; list-style: none; margin: 0 0 6px; padding: 10px 12px; border-radius: 10px; }
    ul { padding: 0; }
    pre { white-space: pre-wrap; margin: 4px 0 0; font-size: 12px; }
    h2 { font-size: 13px; text-transform: uppercase; color: #6c6c70; margin: 20px 4px 8px; }
  </style>
</head>
<body>
  <h1>Testes da LevelUp</h1>
  <div id="summary">A correr…</div>
  <div id="out"></div>

  <script type="module">
    import { toKey, fromKey, addDays, weekday, weekStart, weekKey, monthKey, daysBetween, capsDate, greeting } from './js/engine/dates.js';
    import { makeIndex, checkId, isScheduled, weekCount, todayList, streak, bestStreak, last7, rate, frequencyLabel, migrateV1 } from './js/engine/habits.js';
    import { trigger, journalPrompt, closingLine, hash, TRIGGERS, JOURNAL_PROMPTS } from './js/engine/phrases.js';

    const groups = [];
    let current;
    const group = (name) => groups.push((current = { name, tests: [] }));
    const test = (name, fn) => current.tests.push({ name, fn });
    const eq = (a, b, msg = '') => {
      const A = JSON.stringify(a), B = JSON.stringify(b);
      if (A !== B) throw new Error(`${msg}esperado ${B}, obtido ${A}`);
    };
    const ok = (v, msg = 'esperado verdadeiro') => { if (!v) throw new Error(msg); };

    // Ajudas
    const H = (id, rec = { tipo: 'diario' }, extra = {}) => ({ id, nome: id, recorrencia: rec, criadaEm: '2026-10-01', ...extra });
    const idxOf = (pairs) => makeIndex(pairs.map(([habitId, data]) => ({ habitId, data })));
    const days = (id, from, n) => Array.from({ length: n }, (_, i) => [id, addDays(from, i)]);
    const THU = '2026-11-05'; // quinta-feira

    // ---------- Datas ----------
    group('Datas');
    test('toKey / fromKey ida e volta', () => eq(toKey(fromKey('2026-02-28')), '2026-02-28'));
    test('addDays muda de mês e de ano', () => { eq(addDays('2026-01-31', 1), '2026-02-01'); eq(addDays('2026-12-31', 1), '2027-01-01'); eq(addDays('2026-03-01', -1), '2026-02-28'); });
    test('addDays atravessa a mudança de hora', () => { eq(addDays('2026-03-28', 2), '2026-03-30'); eq(addDays('2026-10-24', 2), '2026-10-26'); });
    test('Dia da semana: 1 = segunda, 7 = domingo', () => { eq(weekday('2026-11-02'), 1); eq(weekday(THU), 4); eq(weekday('2026-11-08'), 7); });
    test('A semana começa à segunda', () => { eq(weekStart('2026-11-08'), '2026-11-02'); eq(weekStart('2026-11-02'), '2026-11-02'); });
    test('Semana ISO', () => { eq(weekKey(THU), '2026-W45'); eq(weekKey('2026-01-01'), '2026-W01'); eq(weekKey('2024-12-30'), '2025-W01'); });
    test('Mês, diferença de dias e etiqueta', () => { eq(monthKey(THU), '2026-11'); eq(daysBetween('2026-11-01', THU), 4); eq(capsDate(THU), 'quinta · 5 de novembro'); });
    test('Saudação por hora', () => {
      eq(greeting(new Date(2026, 10, 5, 8)), 'Bom dia'); eq(greeting(new Date(2026, 10, 5, 15)), 'Boa tarde');
      eq(greeting(new Date(2026, 10, 5, 22)), 'Boa noite'); eq(greeting(new Date(2026, 10, 5, 3)), 'Boa noite');
    });

    // ---------- Agenda dos hábitos ----------
    group('Hábitos do dia');
    test('Diário aparece todos os dias', () => eq(todayList([H('a')], new Set(), THU).length, 1));
    test('Dias específicos (Seg/Qua/Sex)', () => {
      const h = H('x', { tipo: 'dias', dias: [1, 3, 5] });
      ok(isScheduled(h, '2026-11-02')); ok(!isScheduled(h, THU)); ok(isScheduled(h, '2026-11-06'));
    });
    test('Não aparece antes de ter sido criado', () => eq(todayList([H('a', undefined, { criadaEm: '2026-11-06' })], new Set(), THU).length, 0));
    test('Arquivado não aparece', () => eq(todayList([H('a', undefined, { arquivado: true })], new Set(), THU).length, 0));
    test('X por semana: aparece até cumprir a meta', () => {
      const h = H('g', { tipo: 'xPorSemana', n: 2 });
      eq(todayList([h], idxOf([['g', '2026-11-02']]), THU)[0].week, { count: 1, n: 2 });
      eq(todayList([h], idxOf([['g', '2026-11-02'], ['g', '2026-11-03']]), THU).length, 0);
    });
    test('X por semana: marcado hoje continua visível', () => {
      const l = todayList([H('g', { tipo: 'xPorSemana', n: 2 })], idxOf([['g', '2026-11-02'], ['g', THU]]), THU);
      eq(l.length, 1); ok(l[0].done);
    });
    test('X por semana recomeça à segunda', () => {
      const idx = idxOf([['g', '2026-11-02'], ['g', '2026-11-03']]);
      eq(weekCount(idx, H('g'), '2026-11-08'), 2); eq(weekCount(idx, H('g'), '2026-11-09'), 0);
    });
    test('Ordenação: por fazer primeiro', () => {
      const l = todayList([H('a'), H('b')], idxOf([['a', THU]]), THU);
      eq(l.map((i) => i.habit.id), ['b', 'a']);
    });
    test('Etiqueta da frequência', () => {
      eq(frequencyLabel(H('a')), 'Todos os dias'); eq(frequencyLabel(H('a', { tipo: 'dias', dias: [2, 4] })), 'Ter · Qui');
      eq(frequencyLabel(H('a', { tipo: 'xPorSemana', n: 3 })), '3× por semana');
    });

    // ---------- Sequências ----------
    group('Sequências (streaks)');
    test('Sem marcações = 0 dias', () => eq(streak(H('a'), new Set(), THU), { value: 0, unit: 'dias' }));
    test('5 dias seguidos até hoje', () => eq(streak(H('a'), idxOf(days('a', '2026-11-01', 5)), THU).value, 5));
    test('Hoje por fazer não quebra a sequência', () => eq(streak(H('a'), idxOf(days('a', '2026-11-01', 4)), THU).value, 4));
    test('Um dia falhado quebra a sequência', () => {
      const idx = idxOf([...days('a', '2026-10-28', 3), ...days('a', '2026-11-02', 3)]); // falhou 31/10 e 1/11
      eq(streak(H('a'), idx, '2026-11-04').value, 3);
    });
    test('Ontem falhado e hoje por fazer = 0', () => eq(streak(H('a'), idxOf([['a', '2026-11-03']]), THU).value, 0));
    test('Singular: 1 dia', () => eq(streak(H('a'), idxOf([['a', THU]]), THU), { value: 1, unit: 'dia' }));
    test('Dias específicos: dias não agendados não quebram', () => {
      const h = H('m', { tipo: 'dias', dias: [1, 3, 5] }); // seg, qua, sex
      const idx = idxOf([['m', '2026-10-26'], ['m', '2026-10-28'], ['m', '2026-10-30'], ['m', '2026-11-02'], ['m', '2026-11-04']]);
      eq(streak(h, idx, THU).value, 5); // quinta não está agendada
    });
    test('Não conta para trás da data de criação', () => eq(streak(H('a', undefined, { criadaEm: '2026-11-04' }), idxOf(days('a', '2026-11-01', 5)), THU).value, 2));
    test('X por semana: semanas seguidas com a meta cumprida', () => {
      const h = H('g', { tipo: 'xPorSemana', n: 2 });
      const idx = idxOf([['g', '2026-10-19'], ['g', '2026-10-20'], ['g', '2026-10-26'], ['g', '2026-10-27']]);
      eq(streak(h, idx, THU), { value: 2, unit: 'semanas' }); // semana atual ainda em curso não quebra
      eq(streak(h, idxOf([['g', '2026-10-26'], ['g', '2026-10-27'], ['g', '2026-11-02'], ['g', '2026-11-03']]), THU).value, 2);
    });
    test('Melhor sequência de sempre', () => {
      const idx = idxOf([...days('a', '2026-10-01', 10), ...days('a', '2026-10-20', 3)]);
      eq(bestStreak(H('a'), idx, THU), 10);
    });
    test('Últimos 7 dias: feito / falhado / por fazer / não agendado', () => {
      const h = H('m', { tipo: 'dias', dias: [1, 2, 3, 4, 5] });
      const l = last7(h, idxOf([['m', '2026-11-02'], ['m', '2026-11-03']]), THU);
      eq(l.map((d) => d.state), ['miss', 'off', 'off', 'done', 'done', 'miss', 'pending']);
    });
    test('Taxa de 30 dias (hoje por fazer não conta)', () => {
      const h = H('a', undefined, { criadaEm: '2026-11-01' });
      eq(rate(h, idxOf([['a', '2026-11-01'], ['a', '2026-11-02'], ['a', '2026-11-04']]), THU), 0.75);
      eq(rate(H('a', undefined, { criadaEm: THU }), new Set(), THU), null);
    });

    // ---------- Frases ----------
    group('Frases e diário');
    test('A frase do dia é estável (não muda a cada toque)', () => eq(trigger(THU, { hour: 10, slot: 'x' }), trigger(THU, { hour: 10, slot: 'x' })));
    test('Frase de manhã vem das gerais ou das de manhã', () => {
      const t = trigger(THU, { hour: 8, slot: 'hoje' }); ok([...TRIGGERS.geral, ...TRIGGERS.manha].includes(t));
    });
    test('As tuas frases entram na mistura', () => {
      let found = false;
      for (let i = 0; i < 400 && !found; i++) found = trigger(addDays(THU, i), { hour: 15, custom: ['frase minha'] }) === 'frase minha';
      ok(found, 'a frase personalizada nunca apareceu');
    });
    test('Pergunta do diário é estável por dia', () => { eq(journalPrompt(THU), journalPrompt(THU)); ok(JOURNAL_PROMPTS.includes(journalPrompt(THU))); });
    test('Frases variam ao longo dos dias', () => ok(new Set(Array.from({ length: 30 }, (_, i) => trigger(addDays(THU, i), { hour: 15 }))).size > 10));
    test('Hash determinístico', () => eq(hash('abc'), hash('abc')));

    // ---------- Migração ----------
    group('Migração da versão 1');
    test('Hábitos criados por ti passam; exemplos e missões não', () => {
      const tasks = [
        { id: 'h1', titulo: 'Ler', tipo: 'habito', recorrencia: { tipo: 'diario' }, criadaEm: '2026-11-01' },
        { id: 'h2', titulo: 'Ex', tipo: 'habito', seed: true },
        { id: 'm1', titulo: 'CV', tipo: 'pontual', data: THU },
      ];
      const log = [
        { tipo: 'concluir', taskId: 'h1', data: '2026-11-02', ts: 1 },
        { tipo: 'concluir', taskId: 'h1', data: '2026-11-02', ts: 2 }, // duplicado
        { tipo: 'concluir', taskId: 'h2', data: '2026-11-02', ts: 3 },
        { tipo: 'concluir', taskId: 'm1', data: THU, ts: 4 },
      ];
      const r = migrateV1(tasks, log);
      eq(r.habits.map((h) => [h.id, h.nome]), [['h1', 'Ler']]);
      eq(r.checks.map((c) => c.id), [checkId('h1', '2026-11-02')]);
    });

    // ---------- Correr ----------
    let pass = 0, fail = 0;
    const out = document.getElementById('out');
    for (const g of groups) {
      const items = g.tests.map((t) => {
        try { t.fn(); pass++; return `<li class="ok">✓ ${t.name}</li>`; }
        catch (e) { fail++; console.error(t.name, e); return `<li class="fail">✗ ${t.name}<pre>${e.message}</pre></li>`; }
      });
      out.insertAdjacentHTML('beforeend', `<h2>${g.name}</h2><ul>${items.join('')}</ul>`);
    }
    const s = document.getElementById('summary');
    s.textContent = fail ? `${fail} falharam · ${pass} passaram` : `Todos os ${pass} testes passaram ✓`;
    s.className = fail ? 'fail' : 'ok';
    window.__testResults = { pass, fail };
  </script>
</body>
</html>
