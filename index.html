<!doctype html>
<html lang="pt-PT" data-scheme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>LevelUp</title>
  <meta name="description" content="Gamifica a tua vida: missões, hábitos, XP e níveis.">

  <!-- PWA / iOS -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LevelUp">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">

  <!-- Splash screens (ecrã de arranque) dos iPhones atuais -->
  <!-- iPhone 16/17 Pro Max -->
  <link rel="apple-touch-startup-image" href="icons/splash/splash-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <!-- iPhone 14 Pro Max, 15 Plus/Pro Max, 16 Plus -->
  <link rel="apple-touch-startup-image" href="icons/splash/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <!-- iPhone 12/13 Pro Max, 14 Plus -->
  <link rel="apple-touch-startup-image" href="icons/splash/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <!-- iPhone Air -->
  <link rel="apple-touch-startup-image" href="icons/splash/splash-1260x2736.png" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <!-- iPhone XR, 11 -->
  <link rel="apple-touch-startup-image" href="icons/splash/splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
  <!-- iPhone 16 Pro, 17, 17 Pro -->
  <link rel="apple-touch-startup-image" href="icons/splash/splash-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <!-- iPhone 14 Pro, 15, 15 Pro, 16 -->
  <link rel="apple-touch-startup-image" href="icons/splash/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <!-- iPhone 12, 13, 14, 16e -->
  <link rel="apple-touch-startup-image" href="icons/splash/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <!-- iPhone X, XS, 11 Pro, 12/13 mini -->
  <link rel="apple-touch-startup-image" href="icons/splash/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <!-- iPhone SE, 8 -->
  <link rel="apple-touch-startup-image" href="icons/splash/splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">

  <!-- Aplica o tema antes de desenhar (evita "flash" branco no modo escuro) -->
  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('levelup:prefs') || '{}');
        var t = p.tema || 'auto';
        var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.scheme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <div class="status-scrim"></div>
    <main id="screens"></main>
    <nav class="tabbar" id="tabbar" role="tablist" aria-label="Navegação"></nav>
    <div id="overlays"></div>
  </div>
  <noscript>A LevelUp precisa de JavaScript ativo.</noscript>
</body>
</html>
